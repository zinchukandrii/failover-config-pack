[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runtime-failover-config"
version = "0.1.0"
description = "Provider-neutral validation and deterministic simulation for resilient runtime failover policies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andrii Zinchuk" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
runtime-failover = "runtime_failover.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/runtime_failover"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
